<h1>Ragdoll Archers</h1><p class="sub">Every bow, arrow, arena, hat and armour set is unlocked. Drag back anywhere to aim, release to shoot. Headshots kill. In Headshot Frenzy, every headshot after your first adds +50% damage, stacking.</p>
<div id="opts"></div><button id="play">Play</button></div></div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),x=cv.getContext('2d'),W=1200,H=600;
const ARENAS=[['Plains','#7ec8ff','#e2f4ff','#58b04a','#6b4a2f',40,0],['Desert','#ffc27a','#fff0cf','#d9a94f','#a97a35',55,70],['Snow','#9db6d0','#eef4fa','#f4f8fc','#8fa3b8',45,-80],['Night','#070c24','#2b3a74','#2f5d3b','#1c3427',40,30],['Volcano','#3d0f0c','#c4501e','#403030','#1d1412',70,0]];

const ARROWS=['Normal','Triple','Explosive','Fire','Ice','Poison','Piercing','Bouncing','Homing','Heavy','Lightning','Vampire','Splitter','Napalm','Curse'],ACOL=['#e9e2d0','#e9e2d0','#e9e2d0','#ff8a1f','#8fe3ff','#7ddc4a','#c9d3e0','#f0a0ff','#ffd24a','#8a8f99','#ffe94a','#e0245e','#4de0c1','#ff5a1f','#a45cd6'],ADESC=['Standard arrow','Fires 3 arrows in a spread','Explodes on impact','Burns: 8 dmg per turn for 3 turns','Freezes: weaker shots and 5 chill dmg per turn','Poison: 5 dmg per second for 5 seconds, ignores armour','Passes through archers','Bounces off the ground twice','Curves toward the enemy head','Slow, 80% more damage','Zap: +15 damage that ignores armour','Heals you for 60% of the damage dealt','Splits into 3 at the top of its arc','Small blast that sets the enemy on fire','Curse: enemy deals half damage for 2 shots'],HATS=['None','Helmet','Crown','Viking'];

const ARM=[['None',0,'#0000'],['Leather',.15,'#8a5a35'],['Iron',.3,'#aab4c0'],['Gold',.45,'#f2c230'],['Obsidian',.6,'#4b3566']];
const ST=[['head','neck',13],['neck','hip',28],['neck','hl',24],['neck','hr',24],['hip','fl',36],['hip','fr',36],['head','hip',41],['fl','fr',18]];
let S={mode:0,diff:1,arena:0,bow:0,arrow:0,skin:0,hat:0,armor:0},G=null,ph=0,sc=1,ox=0,oy=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('ra')||'{}'))}catch(e){}
const gy=X=>{const a=ARENAS[S.arena];return 440-a[5]*Math.sin(X*.006+ph)-a[5]*.4*Math.sin(X*.017+ph*2)};
const rnd=n=>Math.floor(Math.random()*n);
// ---------- menu ----------
const OPT=[['Mode','mode',['Vs AI','2 Players','Survival','Headshot Frenzy']],['Difficulty','diff',['Easy','Normal','Hard','Insane']],['Arena','arena',ARENAS.map(a=>a[0])],['Bow','bow',BOWS.map(b=>b[0])],['Arrow','arrow',ARROWS],['Archer color','skin',SK],['Hat','hat',HATS],['Armour','armor',ARM.map(a=>a[0]+(a[1]?' −'+Math.round(a[1]*100)+'%':''))]];
for(const[l,k,it]of OPT){const r=document.createElement('div');r.className='row';r.innerHTML='<b>'+l+'</b>';it.forEach((n,i)=>{const b=document.createElement('button');if(k=='skin'){b.className='sw';b.style.background=n;b.title='Color '+(i+1)}else{b.textContent=n;if(k=='arrow')b.title=ADESC[i]}if(S[k]==i)b.classList.add('on');b.onclick=()=>{S[k]=i;[...r.querySelectorAll('button')].forEach((q,j)=>q.classList.toggle('on',j==i));clash();save();live()};r.appendChild(b)});$('#opts').appendChild(r)}
clash();
function showMenu(){$('#menu').hidden=false;document.querySelectorAll('#opts .row').forEach((r,ri)=>{const k=OPT[ri][1];[...r.querySelectorAll('button')].forEach((q,j)=>q.classList.toggle('on',S[k]==j))});clash()}
$('#play').onclick=start;
function bad(s,ar){return ar==1&&s==8||ar==3&&s==0}
function save(){try{localStorage.setItem('ra',JSON.stringify(S))}catch(e){}}
function shine(){x.save();x.lineCap='round';x.strokeStyle='#ffffffd8';x.lineWidth=2.2;x.beginPath();x.arc(0,-1,9,Math.PI*1.12,Math.PI*1.45);x.stroke();x.strokeStyle='#ffffff88';x.lineWidth=1.2;x.beginPath();x.arc(0,-1,6.2,Math.PI*1.2,Math.PI*1.4);x.stroke();x.restore()}
function live(){if(G){const p=G.pl[0];p.bow=S.bow;p.arrow=S.arrow;p.skin=S.skin;p.hat=S.hat;p.armor=S.armor;bar()}}
function clash(){if(bad(S.skin,S.armor))S.skin=SK.findIndex((_,i)=>!bad(i,S.armor));[...document.querySelectorAll('.sw')].forEach((q,i)=>{q.disabled=bad(i,S.armor);q.classList.toggle('on',i==S.skin);q.style.opacity=q.disabled?.25:1;q.style.cursor=q.disabled?'not-allowed':'pointer'})}
function rA(a){a.bow=rnd(5);a.arrow=rnd(15);a.armor=rnd(5);a.hat=rnd(4);do{a.skin=rnd(SK.length)}while(bad(a.skin,a.armor))}
// ---------- archers ----------
function mk(i,X,human,skin,hat){const P={};['head','neck','hip','hl','hr','fl','fr'].forEach(k=>P[k]={x:0,y:0,px:0,py:0});
return{i,x:X,y:gy(X),hp:100,human,skin,hat,armor:0,dead:false,burn:0,frozen:false,aim:i?Math.PI-.6:-.6,pull:0,flash:0,bow:S.bow,arrow:S.arrow,P}}
function pose(a){const P=a.P,d=[Math.cos(a.aim),Math.sin(a.aim)],s=(p,X,Y)=>{p.x=p.px=X;p.y=p.py=Y};
s(P.fl,a.x-9,a.y);s(P.fr,a.x+9,a.y);s(P.hip,a.x,a.y-36);s(P.neck,a.x,a.y-64-Math.sin(G.t/25+a.i*2)*1.3);s(P.head,a.x,a.y-77-Math.sin(G.t/25+a.i*2)*1.3);
s(P.hl,P.neck.x+d[0]*24,P.neck.y+d[1]*24);const k=20-a.pull*26;s(P.hr,P.neck.x+d[0]*k,P.neck.y+d[1]*k)}
function rag(a){const P=a.P;for(const k in P){const p=P[k],vx=(p.x-p.px)*.99,vy=(p.y-p.py)*.99+.45;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy;const g=gy(p.x);if(p.y>g){p.y=g;p.px=p.x-vx*.5;p.py=p.y}}
for(let n=0;n<8;n++)for(const[u,v,l]of ST){const p=P[u],q=P[v],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1,f=(d-l)/d/2;p.x+=dx*f;p.y+=dy*f;q.x-=dx*f;q.y-=dy*f}}
function hurt(a,d,dir,raw){if(a.dead)return;if(!raw)d*=1-ARM[a.armor][1];a.hp=Math.max(0,a.hp-d);a.flash=14;if(a.hp<=0){a.dead=true;for(const k in a.P){const p=a.P[k];p.px=p.x-dir*(2+Math.random()*3);p.py=p.y+3+Math.random()*3}}}
function segD(px,py,p,q){const dx=q.x-p.x,dy=q.y-p.y,t=Math.max(0,Math.min(1,((px-p.x)*dx+(py-p.y)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(px-p.x-dx*t,py-p.y-dy*t)}
function hit(a,r){const P=a.P;if(Math.hypot(r.x-P.head.x,r.y-P.head.y)<12)return'h';
for(const[u,v,w,t]of[['neck','hip',8,'b'],['neck','hl',6,'l'],['neck','hr',6,'l'],['hip','fl',6,'l'],['hip','fr',6,'l']])if(segD(r.x,r.y,P[u],P[v])<w)return t;return 0}
// ---------- combat ----------
function fx(X,Y,n,c,sp=3){for(let i=0;i<n;i++)G.pt.push({x:X,y:Y,vx:(Math.random()-.5)*sp*2,vy:(Math.random()-.7)*sp*2,l:30+rnd(25),m:55,c})}
function say(X,Y,t){G.fl.push({x:X,y:Y,t,l:60})}
function fire(a){const v=a.pull*BOWS[a.bow][1]/60*(a.frozen?.7:1)*(a.arrow==9?.82:1),d=a.aim,sx=a.P.neck.x+Math.cos(d)*28,sy=a.P.neck.y+Math.sin(d)*28,n=a.arrow==1?3:1;
for(let k=0;k<n;k++){const e=n>1?(k-1)*.07:0;G.ar.push({x:sx,y:sy,vx:Math.cos(d+e)*v,vy:Math.sin(d+e)*v,o:a.i,t:a.arrow==1?0:a.arrow,dm:BOWS[a.bow][2]*(a.arrow==9?1.8:1),s:0,age:0})}
if(--a.fz<=0)a.frozen=false;if(a.weak>0)a.weak--;a.pull=0;G.st='fly';G.wait=0}
function boom(X,Y){fx(X,Y,50,'#ff9a2e',6);fx(X,Y,20,'#555',4);G.shake=14;
for(const a of G.pl){let m=1e9;for(const k in a.P){const p=a.P[k],d=Math.hypot(p.x-X,p.y-Y);m=Math.min(m,d);if(d<90&&a.dead){const f=(1-d/90)*6;p.px-=(p.x-X)/(d||1)*f;p.py-=(p.y-Y)/(d||1)*f-2}}
if(m<90&&!a.dead){hurt(a,10+(1-m/90)*90,a.x>X?1:-1);say(a.x,a.y-95,'Boom!')}}}
function fz(r){return(S.mode==3&&r.o==0?1+.5*G.stk:1)*(G.pl[r.o].weak>0?.5:1)}
function hlm(a){return!a.hb&&(a.hat==1||a.hat==3||(a.armor>1&&!a.hat))}
function pd(a,part){if(part!='h')return part=='b'?34:16;if(hlm(a)){a.hb=1;fx(a.P.head.x,a.P.head.y,16,'#aab4c0',4);say(a.x,a.y-122,'Helmet broken!');return 45}return 100}
function hsh(r,a){say(a.x,a.y-100,'HEADSHOT');if(S.mode==3&&r.o==0){if(G.hs++>0){G.stk++;say(a.x,a.y-125,'Stack +'+G.stk*50+'%')}}}
function impact(r,a,part){if(r.t==6&&a){if(r.hh&&r.hh[a.i])return;(r.hh=r.hh||{})[a.i]=1;if(!a.dead){hurt(a,pd(a,part)*r.dm*fz(r),Math.sign(r.vx)||1);if(a.dead)G.pl[r.o].hb=false;if(part=='h')hsh(r,a)}else for(const k in a.P)a.P[k].px-=r.vx*.25;fx(r.x,r.y,10,a.armor?'#ffe9a8':'#c4261d');return}
if(r.t==7&&!a&&(r.b||0)<2){r.b=(r.b||0)+1;r.y=gy(r.x)-3;r.vy=-Math.abs(r.vy)*.65;r.vx*=.85;fx(r.x,r.y,5,'#a98');return}
const vx=r.vx;r.s=1;r.age=0;r.vx=r.vy=0;
if(r.t==2||r.t==13){boom(r.x,r.y);if(G.pl.some(p=>p.dead&&p.i!=r.o))G.pl[r.o].hb=false;if(r.t==13){const e=G.pl[r.o^1];if(!e.dead&&Math.hypot(e.x-r.x,e.y-40-r.y)<110)e.burn=3}r.s=2;return}
if(a){if(!a.dead){const h0=a.hp;hurt(a,pd(a,part)*r.dm*fz(r),Math.sign(vx)||1);if(a.dead)G.pl[r.o].hb=false;if(part=='h')hsh(r,a);if(r.t==11){const sh=G.pl[r.o];sh.hp=Math.min(100,sh.hp+(h0-a.hp)*.6);say(sh.x,sh.y-110,'Drain')}if(r.t==10){hurt(a,15,Math.sign(vx)||1,1);say(a.x,a.y-115,'Zap +15')}if(r.t==3)a.burn=3;if(r.t==4){a.frozen=true;a.fz=2}if(r.t==5){a.psn=5;a.pt=0}if(r.t==14)a.weak=2}
else for(const k in a.P){a.P[k].px-=vx*.25;a.P[k].py+=1}
fx(r.x,r.y,10,a.armor?'#ffe9a8':'#c4261d')}else{fx(r.x,r.y,6,r.t==3?'#ff8a1f':'#a98');if(r.t==3||r.t==4||r.t==5){fx(r.x,r.y,16,ACOL[r.t],3);const e=G.pl[r.o^1];if(!e.dead&&Math.hypot(e.x-r.x,e.y-35-r.y)<85){if(r.t==3){e.burn=3;say(e.x,e.y-105,'Ignited')}if(r.t==4){e.frozen=true;e.fz=2;say(e.x,e.y-105,'Frozen')}if(r.t==5){e.psn=5;e.pt=0;say(e.x,e.y-105,'Poisoned')}}}}}
function trace(sx,sy,aim,v,cb){let X=sx,Y=sy,vx=Math.cos(aim)*v,vy=Math.sin(aim)*v;for(let n=0;n<260;n++){for(let s=0;s<3;s++){vy+=.1667/3;vx+=G.wind/12000;X+=vx/3;Y+=vy/3}if(Y>gy(X)||cb(X,Y,n))break}}
function ai(a,t){const dir=t.x>a.x?1:-1,sp=BOWS[a.bow][1]/60*(a.frozen?.7:1)*(a.arrow==9?.82:1),rl=Math.random(),H0=t.P.head,N0=t.P.neck,B0=t.P.hip,tg=rl<.3?{x:H0.x,y:H0.y}:rl<.9?{x:(N0.x+B0.x)/2,y:(N0.y+B0.y)/2}:Math.random()<.5?{x:H0.x,y:H0.y-170}:(()=>{const xx=H0.x-dir*(130+Math.random()*90);return{x:xx,y:gy(xx)-2}})();if(rl>=.9&&a.arrow==8)a.arrow=0;let best=1e9,ba=0,bp=.8;
for(let th=.1;th<1.45;th+=.025)for(let p=.4;p<=1.001;p+=.03){const aim=dir>0?-th:Math.PI+th;let m=1e9;trace(a.x+Math.cos(aim)*28,a.y-64+Math.sin(aim)*28,aim,p*sp,(X,Y)=>{m=Math.min(m,Math.hypot(X-tg.x,Y-tg.y))});if(m<best){best=m;ba=aim;bp=p}}
const th0=dir>0?-ba:ba-Math.PI;for(let k=0;k<31;k++){const t2=th0-.03+k*.002;for(let p=Math.max(.3,bp-.05);p<=Math.min(1,bp+.05);p+=.004){const aim=dir>0?-t2:Math.PI+t2;let m=1e9;trace(a.x+Math.cos(aim)*28,a.y-64+Math.sin(aim)*28,aim,p*sp,(X,Y)=>{m=Math.min(m,Math.hypot(X-tg.x,Y-tg.y))});if(m<best){best=m;ba=aim;bp=p}}}return{aim:ba,p:bp}}
// ---------- game flow ----------
function start(){$('#menu').hidden=true;$('#res').hidden=true;ph=Math.random()*6;
G={pl:[mk(0,140,1,S.skin,S.hat),mk(1,1060,S.mode==1,(S.skin+3)%8,S.mode==1?(S.hat+1)%4:rnd(4))],turn:0,st:'aim',ar:[],pt:[],fl:[],wind:0,wave:1,hs:0,stk:0,score:0,ait:0,wait:0,t:0,shake:0};
G.pl[0].armor=S.armor;if(S.mode==1){G.pl[1].armor=S.armor;while(bad(G.pl[1].skin,G.pl[1].armor))G.pl[1].skin=(G.pl[1].skin+1)%SK.length}else rA(G.pl[1]);newTurn(true)}
function newTurn(first){const c=G.pl[G.turn],w=ARENAS[S.arena][6];G.wind=(Math.random()*2-1)*(Math.abs(w)||55);G.ait=0;G.st='aim';
if(!first&&c.burn>0){c.burn--;hurt(c,8,0);say(c.x,c.y-95,'Burn -8')}
if(!first&&c.frozen){hurt(c,5,0);say(c.x,c.y-115,'Chill -5')}

if(c.dead){G.st='over';G.wait=0;return}
if(!c.human){c.arrow=rnd(15);c.bow=rnd(5)};bar()}
function endTurn(){if(G.pl.some(p=>p.dead)){G.st='over';G.wait=0;return}G.turn^=1;newTurn()}
